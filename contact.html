<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Percolia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <a class="logo" href="index.html">Percolia</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Contact</h1>
      <p class="tagline">Une question ? Écrivez-nous.</p>
    </section>

    <!--
      Formulaire statique sans backend pour l'instant.
      Brancher un service (Formspree, Netlify Forms, etc.) ou une API
      quand le site sera hébergé.
    -->
    <form>
      <div>
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit">Envoyer</button>
    </form>
  </main>

  <footer>
    &copy; 2026 Percolia. Tous droits réservés.
  </footer>
</body>
</html>
